name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

# Only superseded PR revisions are cancelled; each main/manual run is retained.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  apple-arithmetic:
    name: Apple Silicon arithmetic contract
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record native Apple toolchain and check arithmetic admission
        run: |
          uname -m
          clang++ --version
          test "$(uname -m)" = arm64
          mkdir -p build/apple-arithmetic
          clang++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -fno-fast-math -ffp-contract=off -Icpp/include cpp/tests/test_arithmetic_profile.cpp cpp/src/numerics.cpp -o build/apple-arithmetic/test_arithmetic_profile
          build/apple-arithmetic/test_arithmetic_profile --expect-binary64-long-double
  native:
    name: C++ tests (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare declared build tools
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          python3 -m venv .build-tools
          .build-tools/bin/python -m pip install cmake==4.1.3
          cargo fetch --locked
      - name: Build and test native library independently
        run: python3 tools/ci.py native --compiler ${{ matrix.compiler }}
  rust-unit:
    name: Rust unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare declared build tools
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          python3 -m venv .build-tools
          .build-tools/bin/python -m pip install cmake==4.1.3
          cargo fetch --locked
      - name: Build linked test baseline
        run: python3 tools/build.py --jobs 2
      - name: Run binary module unit tests
        run: python3 tools/ci.py rust-unit
  cli:
    name: CLI integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare declared build tools
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          python3 -m venv .build-tools
          .build-tools/bin/python -m pip install cmake==4.1.3
          cargo fetch --locked
      - name: Build application and linked test baseline
        run: python3 tools/build.py --jobs 2
      - name: Run every ordinary integration target
        run: python3 tools/ci.py cli
  release:
    name: Release application and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare declared build tools
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          python3 -m venv .build-tools
          .build-tools/bin/python -m pip install cmake==4.1.3
          cargo fetch --locked
      - name: Install pinned Rust library notices
        run: rustup component add rust-docs --toolchain 1.98.0
      - name: Build release application
        run: python3 tools/build.py --profile release --jobs 2
      - name: Verify optimized native checks and standalone installation
        run: |
          .build-tools/bin/ctest --test-dir build/native-release --output-on-failure --no-tests=error -j1
          python3 tools/check_install.py --profile release
          python3 tools/ci.py cli --profile release
      - name: Package scoped executable and native SDK
        run: python3 tools/ci.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: irred-ubuntu24.04-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci-package/*.tar.gz
            build/ci-package/*.sha256
          if-no-files-found: error
          retention-days: 14
  contracts:
    name: Documentation and generated contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare declared build tools
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          python3 -m venv .build-tools
          .build-tools/bin/python -m pip install cmake==4.1.3
          cargo fetch --locked
      - name: Check identity helper contracts
        run: |
          python3 tools/test_ci_identity.py
          python3 tools/test_build_files.py
      - name: Regenerate and reject drift
        run: |
          python3 tools/generate_abi.py
          git diff --exit-code
      - name: Check public files and documentation
        run: python3 tools/check_docs.py
