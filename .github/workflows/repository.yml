name: Portable CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare declared build tools
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          python3 -m venv .build-tools
          .build-tools/bin/python -m pip install cmake==4.1.3
          cargo fetch --locked
      - name: Build portable CPU baseline
        run: python3 tools/build.py --jobs 2
      - name: Check generated source consistency
        run: git diff --exit-code
      - name: Run ordinary native and Rust suites
        run: |
          .build-tools/bin/ctest --test-dir build/native --output-on-failure
          cargo test --locked --offline -j2
      - name: Check standalone installation
        run: python3 tools/check_install.py
      - name: Check public files and documentation links
        run: python3 tools/check_docs.py
