[package]
name = "irreducible"
version = "0.1.0"
edition = "2024"
description = "An agent-operated scientific engine with explicit numerical contracts"
license = "BSD-3-Clause"
repository = "https://github.com/sprajs/irreducible"
readme = "README.md"
[[bin]]
name = "irred"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
[profile.dev]
panic = "unwind"
[profile.release]
panic = "unwind"
opt-level = 3
debug = 0
lto = false
codegen-units = 16
overflow-checks = false
incremental = false
